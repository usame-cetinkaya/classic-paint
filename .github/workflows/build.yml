name: Build

on:
  push:
    branches: [main]
    tags: ["*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Apple Silicon runner; the app is built for arm64 only.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then export VERSION="$GITHUB_REF_NAME"; fi
          scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Classic-Paint-dmg
          path: dist/*.dmg

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.dmg --title "Classic Paint $GITHUB_REF_NAME" --generate-notes
